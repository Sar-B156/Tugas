<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Bab 3: Properti & Cara Menari Bondan Kendi</title>
<style>
  :root{
    --bg1:#e8b85f; --bg2:#c98a3a; --brown:#4a2f22; --brown2:#6b4226;
    --cream:#fdeecb; --green:#5c6e3c; --gold:#c9a227; --wrong:#a33; --right:#3a7d44;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Georgia', 'Times New Roman', serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:20px;
    color:var(--brown);
  }
  .card{
    background:var(--cream);
    border:6px solid var(--brown2);
    border-radius:18px;
    max-width:480px; width:100%;
    padding:24px 22px 28px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:10px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 14px, transparent 14px 20px);
  }
  h1{
    font-size:1.3rem; text-align:center; margin:6px 0 2px;
    color:var(--green); letter-spacing:1px;
  }
  .sub{
    text-align:center; font-size:.85rem; color:var(--brown2); margin-bottom:18px;
  }
  #progressWrap{
    background:#e4cfa0; border-radius:10px; height:10px; overflow:hidden; margin-bottom:16px;
    border:1px solid var(--brown2);
  }
  #progressBar{ height:100%; width:0%; background:var(--green); transition:width .35s ease; }
  .qbox{
    background:var(--brown); color:var(--cream);
    border-radius:12px; padding:16px; margin-bottom:16px;
    font-size:1.05rem; line-height:1.4;
    min-height:70px; display:flex; align-items:center;
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    background:#fff8e6; border:2px solid var(--brown2); border-radius:10px;
    padding:12px 14px; text-align:left; font-size:1rem; cursor:pointer;
    color:var(--brown); font-family:inherit; transition:transform .1s ease, background .2s;
  }
  .opt:active{ transform:scale(.98); }
  .opt:hover{ background:#f3e2b8; }
  .opt.correct{ background:var(--right); color:#fff; border-color:var(--right); }
  .opt.wrong{ background:var(--wrong); color:#fff; border-color:var(--wrong); }
  .opt:disabled{ cursor:default; }
  #feedback{
    min-height:22px; text-align:center; font-weight:bold; margin-top:10px; font-size:.95rem;
  }
  .footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:16px;
    font-size:.85rem; color:var(--brown2);
  }
  #nextBtn, #restartBtn{
    background:var(--green); color:#fff; border:none; padding:10px 18px;
    border-radius:8px; font-size:.95rem; cursor:pointer; display:none;
    width:100%; margin-top:14px; font-family:inherit; font-weight:bold;
  }
  #nextBtn:active, #restartBtn:active{ transform:scale(.98); }
  #result{ display:none; text-align:center; }
  #result h2{ color:var(--green); margin-bottom:4px; }
  #scoreText{ font-size:2rem; font-weight:bold; color:var(--brown); margin:10px 0; }
  #scoreNote{ font-size:.9rem; color:var(--brown2); margin-bottom:10px; }
  .umbrella{ text-align:center; font-size:2rem; margin-bottom:4px; }
</style>
</head>
<body>
<div class="card">
  <div class="umbrella">🏺💃🌂</div>
  <h1>KUIS TARI BONDAN KENDI</h1>
  <div class="sub">Bab 3 — Properti dan Cara Menari</div>

  <div id="quizArea">
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div class="qbox" id="questionText">Memuat soal...</div>
    <div class="options" id="optionsArea"></div>
    <div id="feedback"></div>
    <button id="nextBtn">Lanjut ➜</button>
  </div>

  <div id="result">
    <h2>Selesai!</h2>
    <div id="scoreText"></div>
    <div id="scoreNote"></div>
    <button id="restartBtn" style="display:block;">Ulangi Kuis</button>
  </div>

  <div class="footer">
    <span id="qCounter"></span>
    <span id="scoreLive">Skor: 0</span>
  </div>
</div>

<script>
const questions = [
  {
    q: "Menarikan Tari Bondan Kendi membutuhkan latihan tekun karena memadukan keluwesan gerak klasik Surakarta dengan...",
    options: ["Kecepatan tinggi", "Keseimbangan tubuh tinggi", "Suara nyanyian merdu", "Kostum yang berat"],
    answer: 1
  },
  {
    q: "Ada berapa gerak dasar yang harus dikuasai calon penari Bondan Kendi?",
    options: ["4 gerak", "5 gerak", "6 gerak", "7 gerak"],
    answer: 2
  },
  {
    q: "Gerak pembuka penghormatan yang dilakukan sambil bersimpuh disebut...",
    options: ["Ukel", "Sembahan", "Srisig", "Mendhak"],
    answer: 1
  },
  {
    q: "Gerak memutar pergelangan tangan dengan lembut, melambangkan keluwesan, disebut...",
    options: ["Ukel", "Ngayang", "Trisig", "Sembahan"],
    answer: 0
  },
  {
    q: "Berjalan kecil, berjinjit, dan cepat namun tetap halus adalah gerak...",
    options: ["Mendhak", "Ngithing", "Srisig", "Ngayang"],
    answer: 2
  },
  {
    q: "Posisi jari khas tari Jawa yang menjadi simbol keanggunan disebut...",
    options: ["Trisig & Ngithing", "Sembahan", "Mendhak", "Ukel"],
    answer: 0
  },
  {
    q: "Gerak melenggang sambil menggendong boneka, menampilkan kasih sayang, disebut...",
    options: ["Srisig", "Ngayang", "Sembahan", "Ukel"],
    answer: 1
  },
  {
    q: "Posisi tubuh merendah yang menjadi pondasi hampir seluruh gerak tari putri Surakarta adalah...",
    options: ["Ngithing", "Trisig", "Mendhak", "Srisig"],
    answer: 2
  },
  {
    q: "Dalam teknik menjaga keseimbangan, titik berat tubuh sebaiknya dipusatkan di...",
    options: ["Ujung jari kaki", "Tumit", "Tengah telapak kaki", "Pinggul"],
    answer: 2
  },
  {
    q: "Teknik fokus pandangan pada satu titik tetap saat menari di atas kendi mirip dengan teknik...",
    options: ["Spotting balet", "Pernapasan yoga", "Meditasi duduk", "Senam lantai"],
    answer: 0
  },
  {
    q: "Tari Bondan Kendi diiringi oleh...",
    options: ["Musik pop modern", "Gamelan Jawa", "Orkestra biola", "Musik akustik gitar"],
    answer: 1
  },
  {
    q: "Instrumen yang menonjol pada bagian lembut dan memperkuat penjiwaan penari adalah...",
    options: ["Kendang dan gong", "Rebab dan gender", "Bonang dan saron", "Seruling dan angklung"],
    answer: 1
  },
  {
    q: "Saat penari menari di atas kendi, tempo musik menjadi...",
    options: ["Semakin cepat", "Berhenti total", "Melambat dan lebih stabil", "Tidak berubah"],
    answer: 2
  }
];

let current = 0;
let score = 0;
let answered = false;

const questionText = document.getElementById('questionText');
const optionsArea = document.getElementById('optionsArea');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const progressBar = document.getElementById('progressBar');
const qCounter = document.getElementById('qCounter');
const scoreLive = document.getElementById('scoreLive');
const quizArea = document.getElementById('quizArea');
const resultDiv = document.getElementById('result');
const scoreText = document.getElementById('scoreText');
const scoreNote = document.getElementById('scoreNote');
const restartBtn = document.getElementById('restartBtn');

function loadQuestion(){
  answered = false;
  feedback.textContent = '';
  nextBtn.style.display = 'none';
  const item = questions[current];
  questionText.textContent = item.q;
  optionsArea.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx, btn));
    optionsArea.appendChild(btn);
  });
  progressBar.style.width = (current / questions.length * 100) + '%';
  qCounter.textContent = `Soal ${current + 1}/${questions.length}`;
  scoreLive.textContent = `Skor: ${score}`;
}

function selectAnswer(idx, btn){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const allOpts = optionsArea.querySelectorAll('.opt');
  allOpts.forEach(o => o.disabled = true);

  if(idx === item.answer){
    btn.classList.add('correct');
    feedback.textContent = 'Benar! 🎉';
    feedback.style.color = '#3a7d44';
    score++;
  } else {
    btn.classList.add('wrong');
    allOpts[item.answer].classList.add('correct');
    feedback.textContent = 'Kurang tepat.';
    feedback.style.color = '#a33';
  }
  scoreLive.textContent = `Skor: ${score}`;
  nextBtn.style.display = 'block';
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizArea.style.display = 'none';
  resultDiv.style.display = 'block';
  progressBar.style.width = '100%';
  scoreText.textContent = `${score} / ${questions.length}`;
  let note = '';
  const pct = score / questions.length;
  if(pct === 1) note = 'Sempurna! Kamu benar-benar menguasai Bab 3. 🏆';
  else if(pct >= 0.7) note = 'Bagus sekali, hampir sempurna! 👏';
  else if(pct >= 0.5) note = 'Cukup baik, coba baca ulang Bab 3 ya. 📖';
  else note = 'Yuk baca lagi materi Bab 3 tentang gerakan dan iringan tari! 💪';
  scoreNote.textContent = note;
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  resultDiv.style.display = 'none';
  quizArea.style.display = 'block';
  loadQuestion();
});

loadQuestion();
</script>
</body>
</html>
